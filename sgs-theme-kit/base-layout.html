<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="icon" type="image/png" sizes="256x256" href="img/favicon-256.png">
    <link rel="apple-touch-icon" href="img/favicon-256.png">

    <!-- Roboto (SGS brand font) + Font Awesome icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Global site theme -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Navbar logo composition (logo image + portal label).
           The label uses SGS Charcoal Blue (--secondary-color), flat. */
        .nav-logo {
            display: inline-flex !important;
            align-items: center;
            gap: 0.75rem;
            background: none !important;
            -webkit-text-fill-color: initial !important;
            color: var(--secondary-color) !important;
            font-size: 1.4rem !important;
            font-weight: 700 !important;
            letter-spacing: 0 !important;
            text-decoration: none;
        }
        .nav-logo:hover {
            background: none !important;
            -webkit-text-fill-color: initial !important;
            color: var(--primary-color) !important;
            transform: none !important;
        }
        .nav-logo-img { height: 50px; width: auto; display: block; margin-right: -10px; }
        .nav-logo-text { display: inline-block; line-height: 1.1; }
        @media (max-width: 600px) { .nav-logo-text { display: none; } }

        /* Navbar dropdown */
        .nav-dropdown { position: relative; }
        .nav-dropdown .dropdown-toggle { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .nav-dropdown .dropdown-toggle i.fa-caret-down { font-size: 0.75rem; transition: transform 0.2s ease; }
        .nav-dropdown:hover .dropdown-toggle i.fa-caret-down { transform: rotate(180deg); }
        .dropdown-menu {
            position: absolute; top: 100%; left: 0; background: white; min-width: 200px;
            border-radius: var(--border-radius-sm); box-shadow: var(--shadow-lg);
            opacity: 0; visibility: hidden; transform: translateY(10px); transition: all 0.2s ease;
            list-style: none; padding: 0.5rem 0; z-index: 1000; border: 1px solid var(--border-light);
        }
        .nav-dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-menu li a {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
            color: var(--text-primary); text-decoration: none; font-size: 0.875rem; transition: all 0.15s ease;
        }
        .dropdown-menu li a:hover { background: var(--bg-secondary); color: var(--primary-color); }
        .dropdown-menu li a i { width: 16px; text-align: center; color: var(--text-muted); }
        .dropdown-menu li a:hover i { color: var(--primary-color); }

        /* User info */
        .user-info { display: flex; flex-direction: column; align-items: flex-end; margin-right: 0.5rem; }
        .user-name { font-size: 0.875rem; font-weight: 600; color: var(--text-primary); }
        .user-role { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        .nav-container-full { width: 100%; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .footer-container-full { width: 100%; padding: 0.5rem 2rem; text-align: center; }
        .nav-link { display: flex; align-items: center; gap: 0.5rem; }
        .nav-link i { font-size: 0.875rem; }

        /* Hamburger */
        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; z-index: 1001; background: none; border: none; }
        .hamburger span { display: block; width: 24px; height: 2.5px; background: var(--text-primary); border-radius: 2px; transition: all 0.3s ease; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .nav-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10999; }
        .nav-overlay.active { display: block; }

        @media (max-width: 992px) {
            .hamburger { display: flex; }
            .nav-menu {
                position: fixed; top: 0; right: -300px; width: 280px; height: 100vh; background: white;
                flex-direction: column; align-items: stretch; padding: 1rem; gap: 0;
                box-shadow: -4px 0 20px rgba(0,0,0,0.15); z-index: 11000; transition: right 0.3s ease; overflow-y: auto;
            }
            .nav-menu.active { right: 0; }
            .nav-menu li { width: 100%; }
            .nav-menu .nav-link { padding: 12px 16px; border-radius: var(--border-radius-sm); width: 100%; }
            .nav-menu .nav-link:hover { background: var(--bg-secondary); transform: none; box-shadow: none; }
            .nav-dropdown .dropdown-menu { position: static; opacity: 1; visibility: visible; transform: none; box-shadow: none; border: none; padding: 0 0 0 1rem; background: transparent; min-width: auto; }
            .nav-user { margin-left: 0; padding: 1rem 0.5rem; border-bottom: 1px solid var(--border-light); margin-bottom: 0.5rem; order: -1; }
            .user-info { align-items: flex-start; }
        }

        /* Toast notifications (site-wide). window.showToast(msg, type) — type = success|error|info|warning */
        #toast-container { position: fixed; top: 90px; right: 24px; z-index: 11500; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast {
            min-width: 280px; max-width: 380px; background: #ffffff; color: var(--text-primary, #1f2937);
            border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); padding: 14px 18px 14px 16px;
            display: flex; align-items: flex-start; gap: 12px; font-size: 0.92rem; font-weight: 500;
            border-left: 4px solid var(--secondary-color, #3c515b); opacity: 0; transform: translateX(20px);
            transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: auto;
        }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.success { border-left-color: #16a34a; }
        .toast.error   { border-left-color: #dc2626; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.info    { border-left-color: var(--secondary-color, #3c515b); }
        .toast .toast-icon { font-size: 1.1rem; line-height: 1.3; flex-shrink: 0; }
        .toast.success .toast-icon { color: #16a34a; }
        .toast.error   .toast-icon { color: #dc2626; }
        .toast.warning .toast-icon { color: #f59e0b; }
        .toast.info    .toast-icon { color: var(--secondary-color, #3c515b); }
        .toast .toast-msg { flex: 1; line-height: 1.4; word-break: break-word; }
        .toast .toast-close { background: transparent; border: none; color: #9ca3af; cursor: pointer; font-size: 1rem; padding: 0 2px; line-height: 1; }
        .toast .toast-close:hover { color: var(--text-primary, #1f2937); }
        @media (max-width: 640px) { #toast-container { top: 76px; right: 12px; left: 12px; } .toast { min-width: 0; max-width: none; } }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container-full">
            <a href="/" class="nav-logo" aria-label="Portal home">
                <img src="img/sgs-logo.png" alt="SGS" class="nav-logo-img">
                <span class="nav-logo-text">Portal</span>
            </a>

            <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
                <span></span><span></span><span></span>
            </button>

            <div class="nav-overlay" id="navOverlay" onclick="toggleMobileMenu()"></div>

            <ul class="nav-menu" id="navMenu">
                <li><a href="/" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#" class="nav-link"><i class="fas fa-chart-line"></i> Analytics</a></li>

                <!-- Example dropdown -->
                <li class="nav-dropdown">
                    <a href="#" class="nav-link dropdown-toggle"><i class="fas fa-cog"></i> Admin <i class="fas fa-caret-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                        <li><a href="#"><i class="fas fa-users"></i> Manage Users</a></li>
                    </ul>
                </li>

                <li class="nav-user">
                    <div class="user-info">
                        <span class="user-name">Jane Doe</span>
                        <span class="user-role">Admin</span>
                    </div>
                    <a href="#" class="user-avatar" title="Account" style="text-decoration: none; color: white;">J</a>
                    <a href="#" class="logout-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-full">
            <!-- PAGE CONTENT GOES HERE -->
            <div class="hero">
                <h1>Page heading</h1>
                <p>Replace this block with your page content.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container-full">
            <p>&copy; 2026 Portal. All rights reserved.</p>
        </div>
    </footer>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="js/main.js"></script>
    <script>
        function toggleMobileMenu() {
            document.getElementById('hamburger').classList.toggle('active');
            document.getElementById('navMenu').classList.toggle('active');
            document.getElementById('navOverlay').classList.toggle('active');
            document.body.style.overflow = document.getElementById('navMenu').classList.contains('active') ? 'hidden' : '';
        }
    </script>
    <script>
        // Site-wide toast helper: showToast(message, type, duration)
        (function () {
            const ICONS = {
                success: '<i class="fas fa-check-circle"></i>',
                error:   '<i class="fas fa-exclamation-circle"></i>',
                warning: '<i class="fas fa-exclamation-triangle"></i>',
                info:    '<i class="fas fa-info-circle"></i>'
            };
            window.showToast = function (message, type = 'success', duration = 3500) {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = 'toast ' + (ICONS[type] ? type : 'info');
                toast.innerHTML =
                    '<span class="toast-icon">' + (ICONS[type] || ICONS.info) + '</span>' +
                    '<span class="toast-msg"></span>' +
                    '<button class="toast-close" aria-label="Close">&times;</button>';
                toast.querySelector('.toast-msg').textContent = message;
                const remove = () => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 260); };
                toast.querySelector('.toast-close').addEventListener('click', remove);
                container.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('show'));
                if (duration > 0) setTimeout(remove, duration);
            };
        })();
    </script>
</body>
</html>
